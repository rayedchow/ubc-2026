[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelmon-client"
version = "0.1.0"
description = "Remote reward and sealed Gym package clients for Modélmon"
requires-python = ">=3.10"

[project.optional-dependencies]
creator = ["PyNaCl>=1.5,<2"]

[project.scripts]
modelmon-seal = "modelmon.seal:main"
